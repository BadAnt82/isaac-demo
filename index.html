<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="A polished side-scrolling arcade game featuring Jumpy Plane."
    />
    <title>Jumpy Plane</title>
  </head>
  <body>
    <main class="shell" aria-label="Jumpy Plane side-scrolling arcade game">
      <section class="game-frame">
        <canvas id="game" aria-label="Game canvas"></canvas>
        <div class="hud" aria-live="polite">
          <div class="score-panel">
            <span class="label">Score</span>
            <strong id="score">0</strong>
          </div>
          <div class="hud-actions">
            <button id="fullscreen" type="button">Full screen</button>
            <button id="restart" type="button" hidden>Restart</button>
          </div>
        </div>
        <div id="roll" class="roll-action" role="button" tabindex="0" aria-disabled="true">roll (free)</div>
        <div id="overlay" class="overlay">
          <h1>Jumpy Plane</h1>
          <p>Tap, click, or press Space to climb.</p>
          <dl class="high-scores" aria-label="High scores">
            <div>
              <dt>Your highest</dt>
              <dd id="local-high">0</dd>
            </div>
            <div>
              <dt>Today's highest</dt>
              <dd id="today-high">0</dd>
              <span id="today-name" class="score-name">No scorer yet</span>
            </div>
            <div>
              <dt>Server highest</dt>
              <dd id="server-high">0</dd>
              <span id="server-name" class="score-name">No scorer yet</span>
            </div>
          </dl>
          <button id="start" type="button">Start</button>
        </div>
        <div id="record-dialog" class="record-dialog" hidden role="dialog" aria-modal="true" aria-labelledby="record-title">
          <form class="record-card">
            <h2 id="record-title">Congratulations!</h2>
            <p id="record-message">You set a new high score.</p>
            <label for="record-name">Name</label>
            <input id="record-name" name="name" maxlength="24" autocomplete="nickname" />
            <button id="record-save" type="submit">Save score</button>
          </form>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

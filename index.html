<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="A polished side-scrolling arcade game featuring Jumpy Plane."
    />
    <title>Jumpy Plane</title>
  </head>
  <body>
    <main class="shell" aria-label="Jumpy Plane side-scrolling arcade game">
      <section class="game-frame">
        <canvas id="game" aria-label="Game canvas"></canvas>
        <div class="hud" aria-live="polite">
          <div class="score-panel">
            <span class="label">Score</span>
            <strong id="score">0</strong>
          </div>
          <div class="hud-actions">
            <button id="home" type="button" hidden>Home</button>
            <button id="fullscreen" type="button">Full screen</button>
          </div>
        </div>
        <div id="roll" class="roll-action" role="button" tabindex="0" aria-disabled="true">roll (free)</div>
        <div id="overlay" class="overlay">
          <div id="platform-panel" class="overlay-panel platform-panel">
            <h1>Game Select</h1>
            <div class="game-grid" aria-label="Available games">
              <button id="select-plane" class="game-tile" type="button" aria-label="Open Jumpy Plane">
                <span class="tile-plane" aria-hidden="true">
                  <span class="tile-plane-tail"></span>
                  <span class="tile-plane-wing top"></span>
                  <span class="tile-plane-body"></span>
                  <span class="tile-plane-cockpit"></span>
                  <span class="tile-plane-wing bottom"></span>
                  <span class="tile-plane-prop"></span>
                </span>
                <span class="tile-details">
                  <strong>Jumpy Plane</strong>
                  <dl class="tile-scores" aria-label="Jumpy Plane high scores">
                    <div>
                      <dt>Your highest</dt>
                      <dd data-score="local">0</dd>
                    </div>
                    <div>
                      <dt>Today's highest</dt>
                      <dd data-score="today">0</dd>
                    </div>
                    <div>
                      <dt>Server highest</dt>
                      <dd data-score="server">0</dd>
                    </div>
                  </dl>
                </span>
              </button>
            </div>
          </div>
          <div id="game-menu-panel" class="overlay-panel game-menu-panel" hidden>
            <h1>Jumpy Plane</h1>
            <dl class="high-scores" aria-label="Jumpy Plane high scores">
              <div>
                <dt>Your highest</dt>
                <dd data-score="local">0</dd>
              </div>
              <div>
                <dt>Today's highest</dt>
                <dd data-score="today">0</dd>
                <span data-score-name="today" class="score-name">No scorer yet</span>
              </div>
              <div>
                <dt>Server highest</dt>
                <dd data-score="server">0</dd>
                <span data-score-name="server" class="score-name">No scorer yet</span>
              </div>
            </dl>
            <button id="start" type="button">Start</button>
          </div>
          <div id="crash-panel" class="overlay-panel crash-panel" hidden>
            <h1>You Crashed</h1>
            <p id="crash-message">Score 0.</p>
            <dl class="high-scores" aria-label="Jumpy Plane high scores">
              <div>
                <dt>Your highest</dt>
                <dd data-score="local">0</dd>
              </div>
              <div>
                <dt>Today's highest</dt>
                <dd data-score="today">0</dd>
                <span data-score-name="today" class="score-name">No scorer yet</span>
              </div>
              <div>
                <dt>Server highest</dt>
                <dd data-score="server">0</dd>
                <span data-score-name="server" class="score-name">No scorer yet</span>
              </div>
            </dl>
            <button id="restart" type="button" hidden>Restart</button>
          </div>
        </div>
        <div id="record-dialog" class="record-dialog" hidden role="dialog" aria-modal="true" aria-labelledby="record-title">
          <form class="record-card">
            <h2 id="record-title">Congratulations!</h2>
            <p id="record-message">You set a new high score.</p>
            <label for="record-name">Name</label>
            <input id="record-name" name="name" maxlength="24" autocomplete="nickname" />
            <button id="record-save" type="submit">Save score</button>
          </form>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

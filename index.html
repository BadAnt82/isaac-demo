<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="A polished side-scrolling arcade game featuring a yellow prop plane."
    />
    <title>Isaac Demo</title>
  </head>
  <body>
    <main class="shell" aria-label="Isaac side-scrolling arcade game">
      <section class="game-frame">
        <canvas id="game" aria-label="Game canvas"></canvas>
        <div class="hud" aria-live="polite">
          <div class="score-panel">
            <span class="label">Score</span>
            <strong id="score">0</strong>
          </div>
          <div class="hud-actions">
            <button id="fullscreen" type="button">Full screen</button>
            <button id="restart" type="button" hidden>Restart</button>
          </div>
        </div>
        <div id="roll" class="roll-action" role="button" tabindex="0" aria-disabled="true">roll -2</div>
        <div id="overlay" class="overlay">
          <h1>Isaac Demo</h1>
          <p>Tap, click, or press Space to climb.</p>
          <dl class="high-scores" aria-label="High scores">
            <div>
              <dt>Your highest</dt>
              <dd id="local-high">0</dd>
            </div>
            <div>
              <dt>Today's highest</dt>
              <dd id="today-high">0</dd>
            </div>
            <div>
              <dt>Server highest</dt>
              <dd id="server-high">0</dd>
            </div>
          </dl>
          <button id="start" type="button">Start Flight</button>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
